name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.7
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-apk:
    name: Build APK (debug + release R8)
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.7
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      # La build debug ne passe pas par R8 : une règle ProGuard manquante ne se
      # voit qu'en release, à l'exécution. Ce job compile donc aussi la release
      # pour que la CI casse sur un souci de minification, pas l'utilisateur.
      #
      # Aucun keystore en CI : MAASGA_ALLOW_DEBUG_SIGNING autorise la signature
      # debug pour cet artefact de test uniquement (cf. app/build.gradle.kts).
      # L'APK produit ici NE DOIT PAS être distribué.
      - name: Build release APK (R8 smoke test, debug-signed)
        env:
          MAASGA_ALLOW_DEBUG_SIGNING: 'true'
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
          retention-days: 7
